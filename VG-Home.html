<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); padding: 22px; min-height: 100vh; transition: background .2s, color .2s; }
  body[data-theme="dark"]  { --bg:#15120e; --card:#1d1913; --card2:#251f17; --border:#32291f; --border2:#453a2c; --text:#c9c2b8; --heading:#efe8dc; --muted:#9d9387; --label:#a89e91; --accent:#c9a25e; --accentTxt:#c9a25e; --selbg:#33291c; --seltext:#f0e9dd; --btn:#7a5527; --btnhover:#5f421e; --danger:#b03a2e; --panel:#241f17; --txtCard:#F1F1F1; --txtContato:#F1F1F1; --fotoFundo:#0d0b08; }
  body[data-theme="light"] { --bg:#efeae1; --card:#ffffff; --card2:#f6f1e9; --border:#ddd6cb; --border2:#e9e3d8; --text:#3c3730; --heading:#241f19; --muted:#8a8073; --label:#6f675c; --accent:#a3742b; --accentTxt:#8a5f1c; --selbg:#efe5d3; --seltext:#4a3b1d; --btn:#b3862f; --btnhover:#93701f; --danger:#b03a2e; --panel:#fbf8f2; --txtCard:#555555; --txtContato:#555555; --fotoFundo:#e7e1d6; }
  body[data-theme="white"] { --bg:#ffffff; --card:#ffffff; --card2:#f6f6f6; --border:#EEEEEE; --border2:#EEEEEE; --text:#3c3730; --heading:#241f19; --muted:#8a8073; --label:#6f675c; --accent:#a3742b; --accentTxt:#8a5f1c; --selbg:#efe5d3; --seltext:#4a3b1d; --btn:#b3862f; --btnhover:#93701f; --danger:#b03a2e; --panel:#ffffff; --txtCard:#555555; --txtContato:#555555; --fotoFundo:#f2f2f2; }
  body[data-theme="blue"]  { --bg:#0a1c30; --card:#0e2742; --card2:#12324f; --border:#1d4061; --border2:#2b5679; --text:#b9cfe6; --heading:#e4eef9; --muted:#7fa3c4; --label:#90b2d2; --accent:#4fc3f7; --accentTxt:#4fc3f7; --selbg:#16384f; --seltext:#e4eef9; --btn:#1f6fb2; --btnhover:#185c94; --danger:#c0392b; --panel:#112c46; --txtCard:#F1F1F1; --txtContato:#F1F1F1; --fotoFundo:#081726; }
  header { display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; margin-bottom: 18px; }
  header img { width: 44px; height: 44px; object-fit: contain; flex: 0 0 auto; }
  /* O logo dos temas Branco/Claro (cAcFWlp) e o mesmo desenho do Escuro/Azul
     (4rzataM), porem dentro de uma tela maior: 92x81 de desenho numa tela de
     128x128. Como a regra acima usa object-fit: contain, o desenho so aparece
     do tamanho pedido se a caixa for maior: 128*44/92 = 61.22px, o que
     devolve 44 x 38.7px iguais aos do Escuro/Azul. As margens negativas
     devolvem os 8.61px de moldura, para a altura do cabecalho e os 10px de
     separacao do titulo ficarem iguais nos quatro temas. */
  body[data-theme="white"] #header-image,
  body[data-theme="light"] #header-image { width: 61.22px; height: 61.22px; margin: -8.61px; }
  header h1 { color: var(--heading); font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .box { background: var(--card); border: 1px solid var(--border); border-top: 1px solid var(--border2); border-left: 1px solid var(--border2); border-radius: 12px; box-shadow: 0 2px 9px rgba(0, 0, 0, 0.10); }

  /* ============================================================
     Pagina Home do PBIP: menu lateral (x=11 w=219) a esquerda e a
     imagem 'Villa Grano - Imagem Embalagens Torra Especial Gemini'
     a direita (x=244 y=6 w=1036 h=714, fit Fill). Os botoes 'blue' e
     'black' (rodape do menu) foram substituidos pelo filtro TEMA e
     o botao 'Documentacao' foi ignorado.
     ============================================================ */
  .home { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 16px; align-items: stretch; margin-bottom: 16px; }

  /* ---------- area dos botoes de chamada dos paineis ---------- */
  .menu { display: flex; flex-direction: column; padding: 16px 12px 14px; }
  .menu-nav { display: flex; flex-direction: column; gap: 8px; }
  .menu-btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-decoration: none; padding: 12px 12px; border-radius: 9px; border: 1px solid var(--border2); background: var(--card2); color: var(--text); font-size: 14px; line-height: 1.2; transition: background .15s, border-color .15s, color .15s; }
  .menu-btn:hover { background: var(--btn); border-color: var(--btn); color: #fff; }
  .menu-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .menu-btn .seta { flex: 0 0 auto; color: var(--muted); font-size: 15px; }
  .menu-btn:hover .seta, .menu-btn:focus-visible .seta { color: #fff; }

  /* ---------- filtro TEMA: quadro na base da area de paineis, lista sempre aberta ---------- */
  /* links simples (sem fundo/raio/padding de botao): hover muda a cor com
     transição e sublinha; o tema aplicado fica negrito e sublinhado. A cor de
     hover/realce vem de --accentTxt, uma variante escurecida nos temas claros
     para manter contraste AA (>= 4.5:1) em todos os temas. */
  .menu-tema { margin-top: auto; padding-top: 16px; }
  .tema { padding: 12px 12px 10px; border-radius: 10px; }
  .tema-titulo { display: block; font-size: 10px; font-weight: 700; color: var(--label); text-transform: uppercase; letter-spacing: .3px; margin-bottom: 8px; }
  .tema-lista { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .tema-link { display: inline-block; padding: 1px 0; font-size: 13px; line-height: 1.5; color: var(--text); text-decoration: none; border-bottom: 1px solid transparent; transition: color .18s ease, border-color .18s ease; }
  .tema-link:hover { color: var(--accentTxt); border-bottom-color: var(--accentTxt); }
  .tema-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tema-link.sel { color: var(--heading); font-weight: 700; border-bottom-color: var(--accentTxt); }
  @media (prefers-reduced-motion: reduce) { .tema-link { transition: none; } }

  /* ---------- imagem da pagina Home (mantida como esta) ---------- */
  .foto { position: relative; overflow: hidden; padding: 0; min-height: 640px; background: var(--fotoFundo); }
  .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  .contato { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; color: var(--txtContato); font-size: 12px; margin-bottom: 14px; }

  @media (max-width: 860px) { .home { grid-template-columns: minmax(0,1fr); } .foto { min-height: 420px; } }
</style>
</head>

/* ---------- filtro TEMA (seleção única, sem "Todos") ---------- */
const TEMAS = [
  { v: 'white', display: 'Branco' },
  { v: 'dark',  display: 'Escuro' },
  { v: 'light', display: 'Claro'  },
  { v: 'blue',  display: 'Azul'   }
];
/* ---------- TEMA padrao compartilhado entre a Home e os paineis ----------
   A ultima escolha de tema e memorizada no localStorage do navegador, de modo
   que a Home e todos os paineis abrem sempre no mesmo tema. */
const TEMAS_VALIDOS = ['white', 'dark', 'light', 'blue'];
const CHAVE_TEMA = 'vg.tema';
function TEMA_PADRAO(){
  try {
    const s = localStorage.getItem(CHAVE_TEMA);
    if(TEMAS_VALIDOS.includes(s)) return s;
  } catch(e){}
  return 'blue';
}
function salvarTema(t){
  if(!TEMAS_VALIDOS.includes(t)) return;
  try { localStorage.setItem(CHAVE_TEMA, t); } catch(e){}
}
const state = { theme: TEMA_PADRAO() };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const lista = $('tema-lista');

function aplicarTema(t){
  if(!THEME_IMAGES[t]) t = 'blue';
  state.theme = t;
  document.body.dataset.theme = t;
  $('header-image').src = THEME_IMAGES[t];
  salvarTema(t);
  marcaOpcao();
}
function temaSelecionado(){ return state.theme; }
function marcaOpcao(){
  [...lista.querySelectorAll('[data-value]')].forEach(el => {
    const sel = el.dataset.value === state.theme;
    el.classList.toggle('sel', sel);
    if(sel) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
}

lista.innerHTML = TEMAS.map(t =>
  '<a class="tema-link" href="#' + esc(t.v) + '" data-value="' + esc(t.v) + '">' + esc(t.display) + '</a>').join('');

lista.addEventListener('click', e => {
  const el = e.target.closest('[data-value]');
  if(!el) return;
  e.preventDefault();
  aplicarTema(el.dataset.value);
});

aplicarTema(state.theme);
</script>
